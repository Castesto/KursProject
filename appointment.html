<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.svg">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet" href="css/burger.css">
    <link rel="stylesheet" href="css/video-modal.css">
    <link rel="stylesheet" href="css/notifications.css">
    <title>Запись на приём</title>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>
    <header></header>
    <main class="appointment-main">
        <div class="appointment-container">
            <h2 data-i18n="appointment.title">Запись на приём</h2>
            <form class="appointment-form" id="appointmentForm">
                <div class="form-group">
                    <label data-i18n="form.register.firstname">Имя *</label>
                    <input type="text" id="appFirstName" placeholder="Имя" data-i18n-placeholder="form.register.firstname" required>
                </div>
                <div class="form-group">
                    <label data-i18n="form.register.lastname">Фамилия *</label>
                    <input type="text" id="appLastName" placeholder="Фамилия" data-i18n-placeholder="form.register.lastname" required>
                </div>
                <div class="form-group">
                    <label data-i18n="form.register.phone">Телефон *</label>
                    <input type="tel" id="appPhone" placeholder="Номер телефона" data-i18n-placeholder="form.register.phone" required>
                </div>
                <div class="form-group">
                    <label>Врач *</label>
                    <select id="appDoctor" required>
                        <option value="">Выберите врача</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Желаемое время *</label>
                    <input type="datetime-local" id="appDateTime" required>
                </div>
                <button type="submit" data-i18n="appointment.send">Отправить</button>
            </form>
        </div>
    </main>
    <footer></footer>
    <script src="js/preloader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/include.js"></script>
    <script src="js/appointment.js"></script>
    <script src="js/burger.js"></script>
    <script src="js/video-modal.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
