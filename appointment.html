<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.svg">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet" href="css/burger.css">
    <link rel="stylesheet" href="css/notifications.css">
    <title>Запись на приём</title>
</head>

<body>
    <header></header>
    <main class="appointment-main">
        <div class="appointment-container">
            <h2>Запись на приём</h2>
            <form class="appointment-form" id="appointmentForm">
                <div class="form-group">
                    <label>Имя *</label>
                    <input type="text" id="appFirstName" required>
                </div>
                <div class="form-group">
                    <label>Фамилия *</label>
                    <input type="text" id="appLastName" required>
                </div>
                <div class="form-group">
                    <label>Телефон *</label>
                    <input type="tel" id="appPhone" required>
                </div>
                <div class="form-group">
                    <label>Врач *</label>
                    <select id="appDoctor" required>
                        <option value="">Выберите врача</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Желаемое время *</label>
                    <input type="datetime-local" id="appDateTime" required>
                </div>
                <button type="submit">Отправить</button>
            </form>
        </div>
    </main>
    <footer></footer>
    <script src="js/preloader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/include.js"></script>
    <script src="js/appointment.js"></script>
    <script src="js/burger.js"></script>
    <script src="js/notifications.js"></script>
</body>

</html>
