<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.svg">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/burger.css">
    <link rel="stylesheet" href="css/auth.css">
    <title>Регистрация</title>
</head>
<body>
    <header></header>
    <main class="auth-main">
        <div class="auth-container">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="regFirstName" placeholder="Имя" required>
                <input type="text" id="regLastName" placeholder="Фамилия" required>
                <input type="text" id="regPatronymic" placeholder="Отчество" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="tel" id="regPhone" placeholder="Номер телефона" required>
                <input type="text" id="regUsername" placeholder="Логин" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            <div id="registerMessage" class="auth-message"></div>
        </div>
    </main>
    <footer></footer>
    <script src="js/preloader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/burger.js"></script>
    <script src="js/include.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
