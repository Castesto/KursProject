<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/images/logo.svg">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/burger.css">
    <link rel="stylesheet" href="css/video-modal.css">
    <link rel="stylesheet" href="css/auth.css">
    <title>Регистрация</title>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>
    <header></header>
    <main class="auth-main">
        <div class="auth-container">
            <h2 data-i18n="register.title">Регистрация</h2>
            <form id="registerForm">
                <input type="text" id="regFirstName" placeholder="Имя" data-i18n-placeholder="form.register.firstname"
                    required>
                <input type="text" id="regLastName" placeholder="Фамилия" data-i18n-placeholder="form.register.lastname"
                    required>
                <input type="text" id="regPatronymic" placeholder="Отчество"
                    data-i18n-placeholder="form.register.patronymic" required>
                <input type="email" id="regEmail" placeholder="Email" data-i18n-placeholder="form.register.email"
                    required>
                <input type="tel" title="Номер должен быть формата +37529XXXXXXX или +37533XXXXXXX"
                    pattern="\+375(29|33)\d{7}" id="numberInput" name="phoneNumber" placeholder="Телефон" required>
                <input type="text" id="regUsername" placeholder="Логин" required>
                <input type="password" id="regPassword" placeholder="Пароль" required>
                <input type="password" id="regConfirmPassword" placeholder="Подтвердите пароль" required>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            <div id="registerMessage" class="auth-message"></div>
        </div>
    </main>
    <footer></footer>
    <script src="js/preloader.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/burger.js"></script>
    <script src="js/include.js"></script>
    <script src="js/data-i18n.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/video-modal.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/theme.js"></script>
</body>

</html>
